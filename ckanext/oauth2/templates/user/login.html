{% ckan_extends %}

{% block form %}
{{ super() }}
<h2> Login SSO: </h2> <hr>

{% for provider in h.sso_login_options() %}
    <a href="{{ h.url_for('admin.sso', provider=provider) }}" class="btn btn-primary btn-block">
        <i class="fa fa-{{ provider }}"></i> {{ _('Login with %(provider)s', provider=provider) }}
    </a>
    {% endfor %}
{% endblock %}
