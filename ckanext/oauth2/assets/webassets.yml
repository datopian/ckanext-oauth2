oauth2-css:
  filter: cssrewrite
  output: ckanext-oauth2/%(version)s-oauth2.css
  contents:
    - style.css
    - datatables.min.css

oauth2-js:
  filters: rjsmin
  output: ckanext-oauth2/%(version)s-oauth2.js
  contents:
    - datatables.min.js
    - script.js
  
autocomplete-organization:
  filters: rjsmin
  output: ckanext-oauth2/%(version)s-autocomplete-organization.js
  contents:
    - autocomplete-organization.js
  